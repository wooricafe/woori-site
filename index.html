  html,body{height:100%}
  body{
    font-family:"Baloo 2",system-ui,sans-serif;
    background:linear-gradient(180deg, var(--cream-top) 0%, var(--cream) 55%, var(--cream-deep) 100%);
    color:var(--cocoa);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  /* faint floating dots */
  .dot{position:fixed;border-radius:50%;background:var(--milk);opacity:.14;pointer-events:none}
  .d1{width:110px;height:110px;top:18%;left:8%}
  .d2{width:60px;height:60px;top:30%;right:12%}
  .d3{width:150px;height:150px;top:52%;right:18%}
  .d4{width:44px;height:44px;top:60%;left:14%}

  /* wordmark top */
  header{
    padding:clamp(2.2rem,7vh,4.5rem) 1.5rem 0;
    text-align:center;
    z-index:2;
  }
  .wordmark{
    width:min(58%,340px);
    height:auto;
    filter:var(--inkfilter);
    animation:fadein 1.1s ease .1s both;
  }

  /* middle space holds a soft line of copy, kept minimal */
  .middle{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1.5rem 1.5rem;
    z-index:2;
  }
  .middle p{
    max-width:30ch;
    font-weight:500;
    font-size:clamp(1.05rem,3.4vw,1.35rem);
    line-height:1.55;
    color:var(--cocoa-soft);
    animation:fadein 1.1s ease .35s both;
  }
  .middle em{font-style:normal;font-weight:700;color:var(--cocoa)}
  .middle-inner{display:flex;flex-direction:column;align-items:center}
  .social{
    display:flex;
    gap:.8rem;
    margin-top:1.6rem;
    animation:fadein 1.1s ease .5s both;
  }
  .sbtn{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    text-decoration:none;
    color:var(--cocoa);
    background:rgba(255,255,255,.55);
    border:2px solid var(--milk);
    border-radius:999px;
    padding:.5rem 1.1rem;
    font-weight:600;
    font-size:.95rem;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .sbtn:hover,.sbtn:focus-visible{
    background:var(--cocoa);
    color:var(--cream);
    border-color:var(--cocoa);
    transform:translateY(-2px);
    box-shadow:0 6px 0 rgba(90,62,43,.18);
    outline:none;
  }
  .handle{
    margin-top:.9rem !important;
    font-size:.9rem !important;
    font-weight:600 !important;
    color:var(--milk) !important;
    animation:fadein 1.1s ease .6s both;
  }
  .middle .hood{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    margin-top:.55rem;
    font-size:.92rem;
    font-weight:600;
    color:var(--cocoa-soft);
    animation:fadein 1.1s ease .7s both;
  }
  .middle .hood svg{color:var(--milk);flex-shrink:0}

  /* bottom baseline scene */
  .scene{
    position:relative;
    height:clamp(120px,20vh,190px);
    z-index:2;
  }
  .ground{
    position:absolute;
    left:0;right:0;bottom:clamp(26px,4.5vh,44px);
    height:2px;
    background:repeating-linear-gradient(90deg,var(--milk) 0 14px,transparent 14px 26px);
    opacity:.45;
  }
  .comingsoon{
    position:absolute;
    right:clamp(1.2rem,6vw,4rem);
    bottom:calc(clamp(26px,4.5vh,44px) + clamp(70px,11vh,96px));
    font-weight:600;
    font-size:clamp(1.3rem,5vw,2rem);
    color:var(--cocoa);
    animation:fadein 1.1s ease .55s both;
  }
  .comingsoon b{color:var(--milk);font-weight:600}

  /* bread parade sits on the ground, right side */
  .breads{
    position:absolute;
    right:clamp(1rem,5vw,3.2rem);
    bottom:calc(clamp(26px,4.5vh,44px) + 1px);
    width:min(58%,460px);
    height:auto;
    filter:var(--inkfilter);
    animation:fadein 1.1s ease .7s both;
  }

  /* snail crawls in slowly from the left, stops well short of the breads */
  .snail{
    position:absolute;
    bottom:calc(clamp(26px,4.5vh,44px) - 6px);
    width:min(26%,180px);
    height:auto;
    filter:var(--inkfilter);
    left:8%;
    animation:crawl 24s ease-in-out 1s infinite, wobble 2.8s ease-in-out infinite;
  }
  @keyframes crawl{
    0%   {left:8%}
    42%  {left:-14%}
    50%  {left:-14%}
    92%  {left:8%}
    100% {left:8%}
  }
  @keyframes wobble{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%    {transform:translateY(-4px) rotate(1deg)}
  }

  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    .snail{animation:none;left:8%}
    .wordmark,.middle p,.comingsoon,.breads{animation:none}
  }
  @media (max-width:560px){
    .comingsoon{right:1.1rem;bottom:calc(clamp(26px,4.5vh,44px) + clamp(58px,9vh,72px))}
    .breads{width:60%}
    .snail{width:30%;animation:crawl-m 24s ease-in-out 1s infinite, wobble 2.8s ease-in-out infinite}
    @keyframes crawl-m{
      0%   {left:2%}
      42%  {left:-20%}
      50%  {left:-20%}
      92%  {left:2%}
      100% {left:2%}
    }
  }
</style>
</head>
